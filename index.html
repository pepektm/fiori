<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Per te</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #msg{position:fixed;top:7%;text-align:center;font-family:"Courier New",ui-monospace,monospace;font-weight:700;line-height:1.4;pointer-events:none;white-space:pre}
  #l1{color:#ffe9a8;text-shadow:0 0 12px rgba(255,200,80,.7),0 2px 6px #000}
  #l2{color:#ff9fc0;text-shadow:0 0 14px rgba(255,120,170,.8),0 2px 6px #000}
  #msg div{min-height:1.4em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><div id="l1"></div><div id="l2"></div></div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const l1 = document.getElementById('l1'), l2 = document.getElementById('l2'), msg = document.getElementById('msg');
  const LINE1 = 'Buoni 3x3 mesi.', LINE2 = 'Ti amo :)';
  const W = 72;                       // colonne di caratteri
  const RAMP = '.:-+*o%#@';
  let H, Hu, GY, cw, ch, fs, ox, dpr, vw, vh;
  let vis, vctx, sm, sctx, tc, tctx;
  let flowers, grass, specks, stars, particles = [], start, lastSpawn, endTime, finalDrawn;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = t => 1 - Math.pow(1 - t, 3);
  const mul = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };

  const PAL = {
    red:    { a: '#c8102e', b: '#ff6b6b', dark: '#5a0612' },
    pink:   { a: '#ff4f9a', b: '#ffc2dc', dark: '#8a1550' },
    cream:  { a: '#f0d2a8', b: '#fff7ea', dark: '#a06a3a' },
    purple: { a: '#7c3aed', b: '#d8b8ff', dark: '#3b1380' },
    peach:  { a: '#ff7a45', b: '#ffd6b8', dark: '#a02a08' },
    gold:   { a: '#ffb000', b: '#fff08a', dark: '#a05a00' },
    white:  { a: '#ffffff', b: '#e8e4ff', dark: '#9a94c0' }
  };
  // [tipo, x (0-100), y (frazione altezza), raggio, palette]
  const SPEC = [
    ['sun', 50, .36, 15.5], ['sun', 22, .54, 12.5], ['sun', 78, .52, 13],
    ['lily', 33, .32, 10, 'red'], ['lily', 67, .30, 10, 'pink'], ['lily', 12, .40, 8.5, 'cream'],
    ['lily', 89, .41, 8.5, 'red'], ['lily', 40, .51, 9, 'cream'], ['daisy', 61, .53, 8.5, 'white'],
    ['rose', 50, .65, 8.5, 'pink'], ['lily', 31, .71, 7.5, 'purple'], ['lily', 70, .70, 7.5, 'peach'],
    ['daisy', 14, .63, 6.5, 'gold'], ['daisy', 87, .63, 6.5, 'white'],
    ['filler', 27, .25, 3.4, 'purple'], ['filler', 50, .23, 3.4, 'pink'], ['filler', 75, .24, 3.4, 'purple'],
    ['filler', 6, .31, 3, 'peach'], ['filler', 94, .32, 3, 'pink']
  ];

  function setup() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = innerWidth; vh = innerHeight;
    cv.width = vw * dpr; cv.height = vh * dpr;
    const stageW = Math.min(vw, vh * 0.56);
    ox = (vw - stageW) / 2;
    cw = stageW / W; fs = cw / 0.6; ch = fs * 1.1;
    H = Math.floor(vh / ch);
    Hu = 100 * (H * ch) / stageW;            // altezza scena in unita' (larghezza = 100)
    GY = Hu - 13;
    msg.style.left = ox + 'px'; msg.style.width = stageW + 'px';
    msg.style.fontSize = Math.min(stageW * 0.082, 40) + 'px';

    vis = document.createElement('canvas'); vis.width = W * 3; vis.height = H * 3; vctx = vis.getContext('2d');
    sm = document.createElement('canvas'); sm.width = W; sm.height = H; sctx = sm.getContext('2d', { willReadFrequently: true });
    tc = document.createElement('canvas'); tc.width = vw * dpr; tc.height = vh * dpr; tctx = tc.getContext('2d');

    const r = mul(11);
    flowers = SPEC.map((s, i) => {
      const f = { i, type: s[0], x: s[1], y: Math.min(s[2] * Hu, GY - 22), R: s[3] * 1.28, pal: PAL[s[4]] || PAL.gold, rot: r() * 6.28 };
      f.stemStart = 0.9 + i * 0.09;
      f.stemDur = 2.2 + (GY - f.y) / Hu * 1.6;
      f.bloomStart = 3.3 + i * 0.15;
      f.bloomDur = 1.6;
      const bx = 50 + (f.x - 50) * 0.22 + (r() - .5) * 4, by = GY + 2;
      const cx = bx + (f.x - bx) * 0.1 + (r() - .5) * 6, cy = f.y + (by - f.y) * 0.5;
      f.pts = [];
      for (let k = 0; k <= 60; k++) {
        const t = k / 60, u = 1 - t;
        f.pts.push([u * u * bx + 2 * u * t * cx + t * t * f.x, u * u * by + 2 * u * t * cy + t * t * f.y]);
      }
      f.leaves = [];
      const nl = f.type === 'filler' ? 1 : 3;
      for (let k = 0; k < nl; k++) {
        const t = 0.25 + k * 0.22 + r() * 0.06, side = (k + f.i) % 2 ? 1 : -1;
        f.leaves.push({ t, side, len: 8 + r() * 6, ang: 0.5 + r() * 0.5 });
      }
      return f;
    });
    // fiori grandi dietro, piccoli davanti
    flowers.drawOrder = flowers.slice().sort((a, b) => b.R - a.R);
    endTime = Math.max(...flowers.map(f => f.bloomStart + f.bloomDur));

    grass = []; specks = [];
    for (let k = 0; k < 110; k++) grass.push({ x: r() * 100, h: 4 + r() * 8, lean: (r() - .5) * 4, c: r() });
    for (let k = 0; k < 320; k++) specks.push({ x: r() * 100, y: GY + r() * (Hu - GY), s: .5 + r() * 1, c: r() });
    stars = [];
    for (let k = 0; k < 26; k++) stars.push({ x: r() * W, y: r() * H * 0.5, p: r() * 6 });
    finalDrawn = false;
  }

  /* ---------- disegno vettoriale della scena ---------- */
  function petal(c, len, wid) {
    c.beginPath(); c.moveTo(0, 0);
    c.bezierCurveTo(len * .25, -wid, len * .75, -wid * .9, len, 0);
    c.bezierCurveTo(len * .75, wid * .9, len * .25, wid, 0, 0);
    c.closePath();
  }
  function drawLeaf(c, x, y, ang, len, s) {
    if (s <= 0) return;
    c.save(); c.translate(x, y); c.rotate(ang);
    const g = c.createLinearGradient(0, 0, len * s, 0);
    g.addColorStop(0, '#1f6b30'); g.addColorStop(.5, '#3fae55'); g.addColorStop(1, '#8be08f');
    c.fillStyle = g; petal(c, len * s, 3.2 * s); c.fill();
    c.strokeStyle = 'rgba(10,60,20,.6)'; c.lineWidth = .35; c.beginPath(); c.moveTo(0, 0); c.lineTo(len * s * .9, 0); c.stroke();
    c.restore();
  }
  function drawGround(c, time) {
    const rv = clamp(time / 1.2) * 56;
    c.save(); c.beginPath(); c.rect(50 - rv, 0, rv * 2, Hu); c.clip();
    const g = c.createLinearGradient(0, GY, 0, Hu); g.addColorStop(0, '#6b4423'); g.addColorStop(1, '#2a170a');
    c.fillStyle = g; c.fillRect(0, GY, 100, Hu - GY);
    for (const s of specks) { c.fillStyle = s.c < .5 ? '#a8733a' : '#3a2210'; c.fillRect(s.x, s.y, s.s, s.s); }
    c.lineWidth = .8; c.lineCap = 'round';
    for (const b of grass) {
      const gr = clamp((time - 0.3 - Math.abs(b.x - 50) * 0.012) / 1.2);
      if (gr <= 0) continue;
      c.strokeStyle = b.c < .5 ? '#3fae55' : '#7fd07a';
      c.beginPath(); c.moveTo(b.x, GY + 1); c.quadraticCurveTo(b.x + b.lean * .3, GY - b.h * gr * .6, b.x + b.lean, GY - b.h * gr); c.stroke();
    }
    c.restore();
  }
  function drawStem(c, f, time) {
    const g = clamp((time - f.stemStart) / f.stemDur);
    if (g <= 0) return;
    const n = Math.max(1, Math.floor(g * 60));
    c.strokeStyle = '#2f9a45'; c.lineWidth = f.type === 'filler' ? 1 : 1.7; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(f.pts[0][0], f.pts[0][1]);
    for (let k = 1; k <= n; k++) c.lineTo(f.pts[k][0], f.pts[k][1]);
    c.stroke();
    for (const l of f.leaves) {
      const s = ease(clamp((g - l.t) / 0.18));
      const p = f.pts[Math.floor(l.t * 60)];
      drawLeaf(c, p[0], p[1], -Math.PI / 2 + l.side * (0.9 + l.ang), l.len, s);
    }
  }
  function drawFlower(c, f, time) {
    const b = ease(clamp((time - f.bloomStart) / f.bloomDur));
    const stemG = clamp((time - f.stemStart) / f.stemDur);
    if (b <= 0.02) {
      if (stemG > 0.95) { c.fillStyle = '#4cc063'; c.beginPath(); c.ellipse(f.x, f.y, 1.7, 2.4, 0, 0, 6.3); c.fill(); }
      return;
    }
    const R = f.R * b, P = f.pal;
    c.save(); c.translate(f.x, f.y); c.rotate(f.rot + (1 - b) * 1.2);
    if (f.type === 'sun') {
      for (let layer = 0; layer < 2; layer++) {
        const len = R * (layer ? .86 : 1), n = 22;
        const g = c.createLinearGradient(0, 0, len, 0);
        g.addColorStop(0, '#d97a00'); g.addColorStop(.45, layer ? '#ffaa00' : '#ffc61a'); g.addColorStop(1, layer ? '#ffcf3a' : '#ffec7a');
        c.fillStyle = g;
        for (let k = 0; k < n; k++) { c.save(); c.rotate(k * 6.2832 / n + layer * 3.1416 / n); petal(c, len, R * .2); c.fill(); c.restore(); }
      }
      const cg = c.createRadialGradient(0, 0, 0, 0, 0, R * .5);
      cg.addColorStop(0, '#6b3a12'); cg.addColorStop(.7, '#3a1d08'); cg.addColorStop(1, '#1f0e04');
      c.fillStyle = cg; c.beginPath(); c.arc(0, 0, R * .5, 0, 6.3); c.fill();
      for (let j = 0; j < 60; j++) {
        const a = j * 2.39996, rr = R * .47 * Math.sqrt(j / 60);
        c.fillStyle = j % 2 ? '#d49a45' : '#9a622a';
        c.beginPath(); c.arc(Math.cos(a) * rr, Math.sin(a) * rr, R * .04, 0, 6.3); c.fill();
      }
    } else if (f.type === 'lily') {
      for (let layer = 0; layer < 2; layer++) {
        const len = R * (layer ? .8 : 1);
        const g = c.createLinearGradient(0, 0, len, 0);
        g.addColorStop(0, P.dark); g.addColorStop(.3, P.a); g.addColorStop(1, layer ? P.a : P.b);
        c.fillStyle = g;
        for (let k = 0; k < 6; k++) {
          c.save(); c.rotate(k * 1.0472 + layer * .5236);
          petal(c, len, R * (.2 + .18 * b)); c.fill();
          c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = .35; c.beginPath(); c.moveTo(len * .08, 0); c.lineTo(len * .8, 0); c.stroke();
          c.restore();
        }
      }
      c.strokeStyle = '#ffe07a'; c.lineWidth = .35; c.fillStyle = '#ffb000';
      for (let k = 0; k < 6; k++) {
        const a = k * 1.0472 + .3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * R * .5, Math.sin(a) * R * .5); c.stroke();
        c.beginPath(); c.arc(Math.cos(a) * R * .5, Math.sin(a) * R * .5, R * .06, 0, 6.3); c.fill();
      }
    } else if (f.type === 'daisy') {
      const g = c.createLinearGradient(0, 0, R, 0); g.addColorStop(0, P.dark); g.addColorStop(.3, P.b); g.addColorStop(1, P.a);
      c.fillStyle = g;
      for (let k = 0; k < 16; k++) { c.save(); c.rotate(k * 6.2832 / 16); petal(c, R, R * .14); c.fill(); c.restore(); }
      c.fillStyle = '#ffb800'; c.beginPath(); c.arc(0, 0, R * .3, 0, 6.3); c.fill();
      c.fillStyle = '#b36b00'; c.beginPath(); c.arc(0, 0, R * .15, 0, 6.3); c.fill();
    } else if (f.type === 'rose') {
      const g = c.createRadialGradient(0, 0, 0, 0, 0, R); g.addColorStop(0, P.dark); g.addColorStop(.5, P.a); g.addColorStop(1, P.b);
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, 0, 6.3); c.fill();
      c.strokeStyle = P.dark; c.lineWidth = R * .07; c.lineCap = 'round';
      for (let k = 1; k <= 4; k++) { c.beginPath(); c.arc(0, 0, R * (1 - k * .2), k, k + 4.2); c.stroke(); }
    } else {
      for (let k = 0; k < 6; k++) {
        const a = k * 1.0472;
        c.fillStyle = P.a; c.beginPath(); c.arc(Math.cos(a) * R * .6, Math.sin(a) * R * .6, R * .38, 0, 6.3); c.fill();
      }
      c.fillStyle = P.b; c.beginPath(); c.arc(0, 0, R * .35, 0, 6.3); c.fill();
    }
    c.restore();
  }
  function renderScene(time) {
    vctx.setTransform(1, 0, 0, 1, 0, 0);
    vctx.fillStyle = '#000'; vctx.fillRect(0, 0, vis.width, vis.height);
    vctx.setTransform(vis.width / 100, 0, 0, vis.height / Hu, 0, 0);
    drawGround(vctx, time);
    for (const f of flowers) drawStem(vctx, f, time);
    for (const f of flowers.drawOrder) drawFlower(vctx, f, time);
  }

  /* ---------- conversione in caratteri ---------- */
  const colCache = new Map();
  function colStr(r, g, b) {
    const k = (r >> 3) << 10 | (g >> 3) << 5 | (b >> 3);
    let s = colCache.get(k);
    if (!s) { s = `rgb(${(r >> 3) << 3},${(g >> 3) << 3},${(b >> 3) << 3})`; colCache.set(k, s); }
    return s;
  }
  function renderText(time) {
    renderScene(time);
    sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(vis, 0, 0, W, H);
    const d = sctx.getImageData(0, 0, W, H).data;
    tctx.setTransform(1, 0, 0, 1, 0, 0);
    const bg = tctx.createLinearGradient(0, 0, 0, tc.height);
    bg.addColorStop(0, '#05060d'); bg.addColorStop(.7, '#120b24'); bg.addColorStop(1, '#1d1020');
    tctx.fillStyle = bg; tctx.fillRect(0, 0, tc.width, tc.height);
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tctx.font = `bold ${fs}px "Courier New",ui-monospace,monospace`; tctx.textBaseline = 'top';
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2], m = Math.max(r, g, b);
      if (m < 28) continue;
      const v = m / 255, h = hash(x, y);
      let k = Math.floor(v * 8.99) + (h < .25 ? -1 : h > .8 ? 1 : 0);
      k = k < 0 ? 0 : k > 8 ? 8 : k;
      const s = (0.55 + 0.45 * v) * 255 / m;
      tctx.fillStyle = colStr(Math.min(255, r * s), Math.min(255, g * s), Math.min(255, b * s));
      tctx.fillText(RAMP[k], ox + x * cw, y * ch);
    }
  }

  function spawn() {
    const f = flowers[Math.floor(Math.random() * 14)];
    const hearts = Math.random() < .45;
    particles.push({
      x: (f.x / 100) * W + (Math.random() - .5) * 6, y: (f.y / Hu) * H, vx: (Math.random() - .5) * .6, vy: -(0.8 + Math.random() * 1.2),
      ch: hearts ? '<3' : (Math.random() < .5 ? '*' : '.'), col: hearts ? '#ff7aa8' : '#ffe27a', life: 0, max: 3 + Math.random() * 2.5
    });
  }

  let lastT = 0;
  function frame(now) {
    const time = (now - start) / 1000;
    if (time < endTime + .1) renderText(time);
    else if (!finalDrawn) { renderText(endTime + .1); finalDrawn = true; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(tc, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `bold ${fs}px "Courier New",ui-monospace,monospace`; ctx.textBaseline = 'top';
    for (const s of stars) {
      ctx.globalAlpha = .2 + .35 * Math.abs(Math.sin(time * 1.3 + s.p));
      ctx.fillStyle = '#cfd8ff'; ctx.fillText(s.p > 3 ? '+' : '.', ox + s.x * cw, s.y * ch);
    }
    const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016); lastT = now;
    if (time > endTime - 1 && time - lastSpawn > .3) { lastSpawn = time; spawn(); }
    particles = particles.filter(p => p.life < p.max);
    for (const p of particles) {
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = clamp(1 - p.life / p.max) * .9; ctx.fillStyle = p.col;
      ctx.fillText(p.ch, ox + p.x * cw, p.y * ch);
    }
    ctx.globalAlpha = 1;

    const mt = time - (endTime - 0.4);
    if (mt > 0) {
      const n = Math.floor(mt * 11), a = LINE1.length;
      l1.textContent = LINE1.slice(0, Math.min(n, a));
      l2.textContent = n > a + 6 ? LINE2.slice(0, n - a - 6) : '';
    } else { l1.textContent = ''; l2.textContent = ''; }
    requestAnimationFrame(frame);
  }

  start = performance.now(); lastSpawn = 0;
  addEventListener('resize', () => { setup(); });
  addEventListener('pointerdown', () => { start = performance.now(); particles = []; lastSpawn = 0; finalDrawn = false; });
  setup();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
